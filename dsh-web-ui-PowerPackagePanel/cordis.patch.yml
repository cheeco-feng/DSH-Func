# dsh-web-ui-PowerPackagePanel bundle patch: inserts the host plugin row into the
# profile roster. Because this package declares `dsh.bundle.patch`, `dsh plugin
# --profile <name> add <path>` auto-activates it as a profile layer (it joins
# dsh.profile.bundles) and the plugin-manager records it as an installed,
# enable/disable-able, uninstallable user plugin.
#
# This row is a bare host plugin (exports "."): Cordis loads its default export
# via the `apply` export the same way sibling Cheeco packages do, so it loads
# reliably. Browser-side overrides are added later.
- insert:
    - id: web-ui-power-package-panel
      name: '@cheeco/dsh-web-ui-PowerPackagePanel'
